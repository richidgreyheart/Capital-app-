/* Horizonte: tarjetas compactas y controles plegables */
.horizon-card{background:#fff;border:1px solid #e9e9e6;border-radius:17px;margin:10px 0;overflow:hidden}
.horizon-card>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 14px;cursor:pointer}
.horizon-card>summary::-webkit-details-marker{display:none}
.horizon-card>summary:after{content:'⌄';color:#8b8b88;font-size:20px;line-height:1;flex-shrink:0}
.horizon-card[open]>summary:after{content:'⌃'}
.horizon-card-title{font-size:14px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.horizon-card-sub{font-size:12px;color:#777;margin-top:4px;line-height:1.5}
.horizon-countdown{font-size:11px;color:#728477;margin-top:5px;line-height:1.4}
.horizon-countdown.urgent{color:#ac6455;font-weight:600}
.horizon-card-body{padding:0 14px 14px;border-top:1px solid #eeefec}
.horizon-card-body .horizon-actions{padding-top:13px}
.horizon-card-body .horizon-actions button{flex:1;min-width:0;white-space:nowrap}
.horizon-card.form-card>summary{font-weight:500;font-size:14px}
.horizon-card.form-card .horizon-card-body{padding-top:14px}
 
/* Islas plegables: solo titulo y resumen en reposo */
section{margin:18px 0}
.island{background:#f7f7f6;border-radius:24px;margin:12px 0;overflow:hidden}
.island-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;list-style:none;cursor:pointer}
.island-head::-webkit-details-marker{display:none}
.island-copy{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}

.island-copy small{font-size:12px;color:#777;line-height:1.4;overflow-wrap:anywhere}
.island-arrow{color:#888;font-size:19px;flex-shrink:0}
.island[open]>.island-head .island-arrow{transform:rotate(180deg)}
.island-body{padding:0 20px 20px}
.island-body h2{font-size:26px}
.island-body .line{min-width:0}
@media(max-width:420px){main{padding-left:22px;padding-right:22px}.island-head{padding:16px 17px}.island-body{padding:0 17px 17px}}
.yield-overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0;text-align:left}
.yield-overview>div{background:#f7f7f6;border-radius:16px;padding:13px;min-width:0}
.yield-overview small{display:block;color:#777;font-size:11px;line-height:1.4;margin-bottom:7px}
.yield-overview b{font-size:17px;font-weight:550;overflow-wrap:anywhere}
.yield-investment{margin:16px 0}

.home-total{margin:6px 0 24px;text-align:center;border-radius:24px;background:#f7f7f6;overflow:hidden}
.home-total-head{padding:24px 16px;cursor:pointer;list-style:none;user-select:none}
.home-total-head::-webkit-details-marker{display:none}
.home-total-head h2{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
.home-total-chevron{font-size:19px;color:#888;font-weight:400;transition:transform .15s}
.home-total[open] .home-total-chevron{transform:rotate(180deg)}
.home-total-hint{color:#888;font-size:11px}
.home-total-detail{padding:0 16px 20px;text-align:left}

.home-total-detail .yield-overview{margin:8px 0 12px}
.home-estimate-note{display:block;color:#888;font-size:11px;line-height:1.5}

</style><main><header><h1>Capital.</h1><div class="header-actions"><button id="eye" class="eye" aria-label="Mostrar saldos" title="Mostrar u ocultar saldos" onclick="togglePrivacy()"></button><small>MXN</small></div></header><div id="view"></div></main><nav id="nav"></nav><button class="fab" id="quick" onclick="openQuick()" aria-label="Registrar movimiento rápido">+</button><div id="overlay"></div><script>
const seed={p:[],free:0,logs:[],goal:1000000,monthly:8000,extra:0,rate:8,reserve:0,tol:0,monthlyDay:15,milestones:[{id:545000,label:"Recuperar patrimonio anterior",amount:545000},{id:600000,label:"600 mil",amount:600000},{id:700000,label:"700 mil",amount:700000},{id:800000,label:"800 mil",amount:800000},{id:900000,label:"900 mil",amount:900000},{id:1000000,label:"Primer millón",amount:1000000}],scheduled:[]};let s;try{s=JSON.parse(localStorage.getItem('capital-v2'))||structuredClone(seed)}catch(e){s=structuredClone(seed)}

function isMarket(p){return !!p&&(/^(bolsa|acciones|etf|etfs|gbm)$/i.test(p.n.trim())||p.market===true)}
function marketLog(l){return l.market===true||s.p.some(p=>isMarket(p)&&(l.n===p.n||String(l.n).split(' → ').includes(p.n)))||/^(Bolsa|GBM|Acciones|ETF)(?:$| · | → )/i.test(l.n)}

function activityIsland(title,rows){return `<details class="island"><summary class="island-head"><span class="island-copy"><strong>${title}</strong><small>${rows.length} movimientos</small></span><span class="island-arrow">⌄</span></summary><div class="island-body">${rows.map(l=>{let neg=/^(Retiro|Pérdida|Disponer|Minusvalía|Comisión|Venta con retiro)/.test(l.k)||Number(l.v)<0, gain=/^(Rendimiento|Ganancia|Plusvalía|Dividendo)/.test(l.k);return `<div class="line"><span>${esc(l.k)}<br><small>${esc(l.n)} · ${new Date(l.date).toLocaleDateString('es-MX')}</small></span><b style="color:${neg?'#ac6455':gain?'#728477':'#171717'}">${neg?'−':gain?'+':''}${money(Math.abs(l.v))}</b></div>`}).join('')||'<p>Sin movimientos.</p>'}</div></details>`}

if(kind==='buy'){name=x?x.name:prompt('Nombre o ticker');if(!name||!name.trim())return;q=askNumber('Número de títulos');v=askNumber('Importe de compra en MXN');if(q===null||v===null)return;let source=prompt('Origen: 1 = dinero externo, 2 = dinero libre, 3 = saldo ya registrado en Bolsa','1');if(!['1','2','3'].includes(source))return;if(source==='2'&&v>s.free||source==='3'&&v>cash+0.005)return alert('Saldo insuficiente');if(source==='2')s.free-=v;if(source!=='3')p.v+=v;if(!x){x={name:name.trim(),qty:0,cost:0,value:0};hs.push(x)}x.qty+=q;x.cost+=v;x.value+=v;k=source==='3'?'Compra con saldo existente':'Compra de acciones';delta=v;}

')}</small></span><b>${money(x.net)}</b></div>`).join('')||'<p class="muted">Aún no hay ganancias registradas.</p>'}</div></div></details>`}

function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

function dateLabel(d){return d.toLocaleDateString('es-MX',{month:'short',year:'numeric'})}
function effectiveDay(year,month,day){return Math.min(Number(day),new Date(year,month+1,0).getDate())}
function recurringForDate(date){return s.recurring.filter(x=>x.active!==false&&Number(x.amount)>0&&effectiveDay(date.getFullYear(),date.getMonth(),x.day)===date.getDate()).map(x=>({...x,occurrence:dateKey(date),kind:'recurring'}))}
function pendingExtrasForDate(date){return s.scheduled.filter(x=>x.date===dateKey(date)&&x.status!=='done'&&x.status!=='skipped').map(x=>({...x,kind:'extra'}))}
function contributionDone(id,date){return s.completedContributions.some(x=>String(x.ruleId)===String(id)&&x.date===date)}
function contributionEvents(date){return [...recurringForDate(date).filter(x=>!contributionDone(x.id,x.occurrence)),...pendingExtrasForDate(date)]}
function horizonProjection(){
 const today=new Date(),start=new Date(today.getFullYear(),today.getMonth(),today.getDate());
 const targets=s.milestones.filter(x=>Number.isFinite(Number(x.amount))&&Number(x.amount)>0).sort((a,b)=>a.amount-b.amount);
 const hits={};let balance=total(),points=[{date:start,value:balance}],rate=Math.max(0,Math.min(100,Number(s.rate)||0));
 for(const t of targets)if(balance>=t.amount)hits[t.id]={date:start,already:true};
 // Simulación diaria: permite dos o más aportaciones mensuales, fechas extraordinarias y meses cortos.
 const daily=Math.pow(1+rate/100,1/365.2425);
 let date=new Date(start);const end=new Date(start);end.setFullYear(end.getFullYear()+50);
 let first=true;
 while(date<end){date=new Date(date.getFullYear(),date.getMonth(),date.getDate()+1);balance*=daily;
  if(first){balance+=Math.max(0,Number(s.extra)||0);first=false}
  for(const x of contributionEvents(date))balance+=Math.max(0,Number(x.amount)||0);
  if(date.getDate()===1||dateKey(date)===dateKey(end))points.push({date:new Date(date),value:balance});
  for(const t of targets)if(!hits[t.id]&&balance>=t.amount)hits[t.id]={date:new Date(date),already:false};
  if(Object.keys(hits).length===targets.length&&points.length>=25)break;
 }
 if(points[points.length-1].date.getTime()!==date.getTime())points.push({date:new Date(date),value:balance});
 return {hits,points,targets,start};
}
function horizonCalendar(){
 const now=new Date(),d=new Date(now.getFullYear(),now.getMonth()+horizonMonth,1),offset=(d.getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),pr=horizonProjection();
 const marked=pr.targets.filter(t=>pr.hits[t.id]&&monthKey(pr.hits[t.id].date)===monthKey(d)&&!pr.hits[t.id].already);
 let html=`<div class="cal-head"><button onclick="horizonMonth--;render()" aria-label="Mes anterior">‹</button><strong>${esc(d.toLocaleDateString('es-MX',{month:'long',year:'numeric'}))}</strong><button onclick="horizonMonth++;render()" aria-label="Mes siguiente">›</button></div><div class="calendar-grid">`;
 for(const x of ['L','M','M','J','V','S','D'])html+=`<span class="cal-week">${x}</span>`;
 for(let i=0;i<offset;i++)html+='<span></span>';
 for(let day=1;day<=days;day++){
  const dt=new Date(d.getFullYear(),d.getMonth(),day),iso=dateKey(dt),events=contributionEvents(dt),completed=s.completedContributions.some(x=>x.date===iso)||s.scheduled.some(x=>x.date===iso&&x.status==='done');
  const recurring=events.some(x=>x.kind==='recurring'),special=events.some(x=>x.kind==='extra'),hit=marked.some(t=>dateKey(pr.hits[t.id].date)===iso);
  html+=`<div class="cal-day ${recurring?'contribution':''} ${special?'special':''} ${hit?'milestone':''}" onclick="showCalendarDay('${iso}')" title="Ver aportaciones del día"><span>${day}</span><span class="cal-dots">${recurring?'<i class="dot green-dot"></i>':''}${special?'<i class="dot dark-dot"></i>':''}${completed?'<i class="dot green-dot" style="outline:1px solid #728477"></i>':''}${hit?'<i class="dot red-dot"></i>':''}</span></div>`;
 }
 html+='</div><p class="muted">● Verde: quincenal / recurrente · ● Negro: extraordinaria · ● Terracota: hito estimado. Toca un día para consultar o confirmar.</p>';
 const extras=s.scheduled.filter(x=>x.date.slice(0,7)===monthKey(d));
 const completed=s.completedContributions.filter(x=>x.date.slice(0,7)===monthKey(d));
 if(!privacy&&(extras.length||completed.length||marked.length))html+=`<div class="cal-events">${extras.map(x=>`<p>• ${esc(x.date)} · ${esc(x.label||'Extraordinaria')} · ${money(x.amount)} · ${x.status==='done'?'Realizada':x.status==='skipped'?'Omitida':'Programada'}</p>`).join('')}${completed.map(x=>`<p>✓ ${esc(x.date)} · ${esc(x.label)} · ${money(x.amount)} · Realizada</p>`).join('')}${marked.map(t=>`<p>• Hito previsto: ${esc(t.label)} (${money(t.amount)})</p>`).join('')}</div>`;
 return html;
}

function horizonGraph(pr){
 const pts=pr.points.slice(0,Math.min(pr.points.length,61)),max=Math.max(1,...pts.map(x=>x.value)),min=0;
 const coords=pts.map((x,i)=>[12+i*296/Math.max(1,pts.length-1),146-(x.value-min)/(max-min)*126]);
 const path=coords.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const lines=pr.targets.filter(t=>t.amount<=max).slice(0,7).map(t=>{let y=146-t.amount/max*126;return `<line x1="12" x2="308" y1="${y}" y2="${y}" stroke="#dededb" stroke-dasharray="3 5"/><text x="14" y="${y-3}" font-size="9" fill="#888">${Math.round(t.amount/1000)}k</text>`}).join('');
 return `<svg viewBox="0 0 320 168" role="img" aria-label="Proyección estimada del patrimonio">${lines}<path d="${path}" fill="none" stroke="#728477" stroke-width="2.5" stroke-linecap="round"/><text x="12" y="164" font-size="10" fill="#888">Hoy</text><text x="265" y="164" font-size="10" fill="#888">${dateLabel(pts[pts.length-1].date)}</text></svg>`;
}
function investmentSelect(id,selected=''){return `<label>Destino de la aportación<select id="${id}"><option value="">Seleccionar al realizar</option>${s.p.map(p=>`<option value="${p.id}" ${String(selected)===String(p.id)?'selected':''}>${esc(p.n)}</option>`).join('')}</select></label>`}
function countdownLabel(iso,status){
 if(status==='done')return {label:'Aportación realizada',urgent:false};
 if(status==='skipped')return {label:'Aportación omitida',urgent:false};
 const today=new Date(),start=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());
 const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));
 if(!match)return {label:'Fecha no disponible',urgent:false};
 const due=Date.UTC(Number(match[1]),Number(match[2])-1,Number(match[3]));
 const diff=Math.round((due-start)/86400000);
 return diff<0?{label:'Vencida hace '+Math.abs(diff)+' día'+(diff===-1?'':'s'),urgent:true}:diff===0?{label:'Vence hoy',urgent:true}:diff===1?{label:'Falta 1 día',urgent:true}:{label:'Faltan '+diff+' días',urgent:diff<=3};
}
function compactExtra(x){
 const c=countdownLabel(x.date,x.status),status=x.status==='done'?'Realizada':x.status==='skipped'?'Omitida':'Programada';
 return `<details class="horizon-card"><summary><div style="min-width:0;flex:1"><div class="horizon-card-title">${esc(x.label||'Extraordinaria')}</div><div class="horizon-card-sub">${esc(x.date)} · ${money(x.amount)} · ${status}</div><div class="horizon-countdown ${c.urgent?'urgent':''}">${esc(c.label)}</div></div></summary><div class="horizon-card-body">${privacy?'<p class="privacy-note">Muestra los saldos para gestionar esta aportación.</p>':`<div class="horizon-actions">${x.status==='pending'?`<button onclick="completeScheduled(${Number(x.id)})">Realizada</button><button onclick="skipScheduled(${Number(x.id)})">Omitir</button>`:''}<button onclick="removeScheduled(${Number(x.id)})">Eliminar</button></div>`}</div></details>`;
}

 const pr=horizonProjection(),t=total(),next=pr.targets.find(x=>x.amount>t),rate=Number(s.rate)||0;
 let h=`<div class="center"><small>Horizonte · patrimonio en el tiempo</small><h2>${money(t)}</h2><p class="green">${privacy?'••••':rate.toFixed(2)+'%'} anual supuesto</p></div>`;
 h+=`<details class="island"><summary class="island-head"><span class="island-copy"><strong>Próximo hito</strong><small>${next?`${esc(next.label)} · ${money(next.amount)} · ${privacy?'••••':pr.hits[next.id]?esc(pr.hits[next.id].date.toLocaleDateString('es-MX',{month:'short',year:'numeric'})):'Sin fecha'}`:'Todos alcanzados'}</small></span><span class="island-arrow">⌄</span></summary><div class="island-body"><h2>${next?money(next.amount):'Todos los hitos alcanzados'}</h2>${next?`<p>${esc(next.label)} · ${privacy?'••••':Math.min(100,t/next.amount*100).toFixed(1)+'%'} completado</p><progress max="1" value="${privacy?0:Math.min(1,t/next.amount)}"></progress><p>Fecha estimada: ${privacy?'••••':pr.hits[next.id]?esc(pr.hits[next.id].date.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'})):'Fuera del horizonte'}</p>`:''}</div></details>`;
 h+=`<details class="island"><summary class="island-head"><span class="island-copy"><strong>Línea de tiempo</strong><small>${`${pr.targets.length} hitos · Proyección patrimonial`}</small></span><span class="island-arrow">⌄</span></summary><div class="island-body"><p class="muted">Proyección ilustrativa basada en aportaciones fechadas y rendimiento supuesto.</p>${privacy?'<p class="privacy-note">Muestra los saldos para ver tu posición.</p>':timelineBullets(pr)}<div style="${privacy?'filter:blur(12px);opacity:.25':''}">${horizonGraph(pr)}</div><div class="timeline">${pr.targets.map(x=>{let hit=pr.hits[x.id];return `<div class="line"><span><b>${esc(x.label)}</b><br><small>${money(x.amount)}</small></span><span class="horizon-date">${privacy?'••••':hit?(hit.already?'Alcanzado':hit.date.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})):'Sin fecha'}</span></div>`}).join('')}</div></div></details>`;
 h+=`<details class="island"><summary class="island-head"><span class="island-copy"><strong>Calendario de aportaciones</strong><small>${`Ver aportaciones por fecha`}</small></span><span class="island-arrow">⌄</span></summary><div class="island-body">${horizonCalendar()}</div></details>`;
 h+=`<details class="island"><summary class="island-head"><span class="island-copy"><strong>Aportaciones recurrentes</strong><small>${`${s.recurring.length} días programados · ${money(s.recurring.reduce((a,x)=>a+(x.active===false?0:Number(x.amount)||0),0))} al mes`}</small></span><span class="island-arrow">⌄</span></summary><div class="island-body"><p class="muted">Puedes configurar tantos días como necesites, con importes y destinos distintos. En febrero, los días 30 y 31 pasan al último día del mes.</p>${s.recurring.map(x=>`<div class="line event-row"><div class="event-info"><b>${esc(x.label||'Aportación')}</b><small>Día ${x.day} · ${money(x.amount)} · ${esc(s.p.find(p=>String(p.id)===String(x.target))?.n||'Destino por elegir')}</small></div>${privacy?'':`<div class="horizon-actions"><button onclick="editRecurring(${Number(x.id)})">Editar</button><button onclick="removeRecurring(${Number(x.id)})">Eliminar</button></div>`}</div>`).join('')}${privacy?'<p class="privacy-note">Muestra los saldos para editar.</p>':`<div class="horizon-form">${field('Descripción','recLabel','Aportación quincenal','text')}${field('Día del mes (1–31)','recDay',15)}${field('Importe por aportación (MXN)','recAmount',4000)}${investmentSelect('recTarget')}<button onclick="addRecurring()">+ Añadir día de aportación</button></div>`}<p class="muted">Total mensual recurrente: ${money(s.recurring.reduce((a,x)=>a+(x.active===false?0:Number(x.amount)||0),0))}. Programar no modifica saldos.</p></div></details>`;
 h+=`<details class="island"><summary class="island-head"><span class="island-copy"><strong>Aportaciones extraordinarias</strong><small>${`${s.scheduled.filter(x=>x.status==='pending').length} pendientes · ${money(s.scheduled.filter(x=>x.status==='pending').reduce((a,x)=>a+(Number(x.amount)||0),0))} previstos`}</small></span><span class="island-arrow">⌄</span></summary><div class="island-body"><p class="muted">${s.scheduled.length} aportación${s.scheduled.length===1?'':'es'} registrada${s.scheduled.length===1?'':'s'}. Toca una para ver sus acciones.</p>${[...s.scheduled].sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(compactExtra).join('')||'<p>Sin aportaciones extraordinarias.</p>'}${privacy?'':`<details class="horizon-card form-card"><summary>+ Nueva aportación extraordinaria</summary><div class="horizon-card-body">${field('Descripción','scheduledLabel','','text')}${field('Fecha','scheduledDate','','date')}${field('Importe (MXN)','scheduledAmount','')}${investmentSelect('scheduledTarget')}<button class="wide" onclick="addScheduled()">Guardar aportación</button></div></details>`}</div></details>`;
 h+=`<details class="island"><summary class="island-head"><span class="island-copy"><strong>Supuestos de proyección</strong><small>${`${privacy?'••••':rate.toFixed(1)+'%'} anual · Extra inmediata ${money(s.extra)}`}</small></span><span class="island-arrow">⌄</span></summary><div class="island-body">${privacy?'<p class="privacy-note">Muestra los importes para editar.</p>':field('Rendimiento anual supuesto (%)','rate',s.rate)+field('Aportación extraordinaria inmediata (MXN)','extra',s.extra)+'<button onclick="saveHorizonPlan()">Guardar supuestos</button>'}<p class="muted">Las aportaciones recurrentes se suman según sus fechas. Las programadas solo pasan a tus saldos cuando las confirmas como realizadas.</p></div></details>`;
 h+=`<details class="island"><summary class="island-head"><span class="island-copy"><strong>Mis hitos personalizados</strong><small>${`${pr.targets.length} objetivos · Próximo ${next?money(next.amount):'completados'}`}</small></span><span class="island-arrow">⌄</span></summary><div class="island-body">${pr.targets.map(x=>`<div class="line"><span>${esc(x.label)}<br><small>${money(x.amount)}</small></span>${privacy?'':`<button onclick="removeMilestone(${Number(x.id)})">Eliminar</button>`}</div>`).join('')}${privacy?'':field('Nombre del nuevo hito','newMilestoneLabel','','text')+field('Monto objetivo (MXN)','newMilestoneAmount','')+'<button onclick="addMilestone()">+ Añadir hito</button>'}</div></details>`;
 h+=`<details class="island"><summary class="island-head"><span class="island-copy"><strong>Margen de disposición</strong><small>${`${money(margin())} disponible estimado`}</small></span><span class="island-arrow">⌄</span></summary><div class="island-body"><h2>${money(margin())}</h2><p>Limitado por liquidez confirmada, reserva y escenario conservador.</p>${field('Simular retiro','sim',0)}<button onclick="simulate()">Simular</button><p id="simresult"></p></div></details>`;
 h+=`<details class="island"><summary class="island-head"><span class="island-copy"><strong>Otros supuestos</strong><small>${`Objetivo ${money(s.goal)} · Reserva ${money(s.reserve)}`}</small></span><span class="island-arrow">⌄</span></summary><div class="island-body">${privacy?'<p class="privacy-note">Muestra los importes para editar.</p>':field('Objetivo principal','goal',s.goal)+field('Reserva líquida','reserve',s.reserve)+field('Retraso aceptable en meses','tol',s.tol)+'<button onclick="saveOtherSettings()">Guardar</button>'}</div></details>`;

function saveHorizonPlan(){let r=num('rate'),extra=num('extra');if(![r,extra].every(Number.isFinite)||extra<0||r<0||r>100)return alert('Revisa los supuestos.');s.rate=r;s.extra=extra;save()}
function syncRecurringTotal(){s.monthly=s.recurring.reduce((a,x)=>a+(x.active===false?0:Number(x.amount)||0),0)}
function addRecurring(){let label=$('recLabel').value.trim(),day=num('recDay'),amount=num('recAmount'),target=$('recTarget').value;if(!Number.isInteger(day)||day<1||day>31||!positive(amount))return alert('Introduce un día del 1 al 31 y un importe positivo.');if(s.recurring.length>=50)return alert('Máximo 50 reglas recurrentes.');s.recurring.push({id:Date.now(),label:label.slice(0,70)||'Aportación',day,amount,target,active:true});syncRecurringTotal();save()}
function removeRecurring(id){if(confirm('¿Eliminar esta regla? Los movimientos realizados permanecerán en Actividad.')){s.recurring=s.recurring.filter(x=>x.id!==id);syncRecurringTotal();save()}}
function editRecurring(id){let x=s.recurring.find(x=>x.id===id);if(!x)return;let day=prompt('Día del mes (1–31)',x.day);if(day===null)return;let amount=prompt('Importe por aportación (MXN)',x.amount);if(amount===null)return;let d=Number(day),a=Number(amount);if(!Number.isInteger(d)||d<1||d>31||!positive(a))return alert('Día o importe inválido.');x.day=d;x.amount=a;syncRecurringTotal();save()}
function contributionTarget(target){let p=s.p.find(x=>String(x.id)===String(target));if(p)return p;if(!s.p.length){alert('Primero crea una inversión en Cartera.');return null}let choices=s.p.map((p,i)=>`${i+1}. ${p.n}`).join('\n');let answer=prompt('Selecciona el número de inversión destino:\n'+choices);if(answer===null)return null;let n=Number(answer);if(!Number.isInteger(n)||n<1||n>s.p.length){alert('Destino inválido');return null}return s.p[n-1]}
function finishContribution(x,date,kind){let p=contributionTarget(x.target);if(!p)return false;let amount=Number(x.amount);if(!positive(amount))return false;if(!confirm('¿Confirmas que aportaste '+amount.toLocaleString('es-MX',{style:'currency',currency:'MXN'})+' a '+p.n+' el '+date+'? Se sumará al saldo real.'))return false;p.v=Math.round((p.v+amount)*100)/100;log('Aportación programada',p.n,amount);s.logs[0].date=date+'T12:00:00';if(kind==='recurring')s.completedContributions.push({ruleId:x.id,date,amount,label:x.label||'Recurrente',target:p.id});else{x.status='done';x.target=p.id}save();return true}
function showCalendarDay(iso){if(privacy)return alert('Muestra los saldos con el ojo para gestionar las aportaciones.');let dt=new Date(iso+'T12:00:00'),pending=contributionEvents(dt),done=s.completedContributions.filter(x=>x.date===iso),extraDone=s.scheduled.filter(x=>x.date===iso&&x.status==='done');let lines=pending.map((x,i)=>`${i+1}. ${x.label||'Aportación'} · $${Number(x.amount).toLocaleString('es-MX')} (${x.kind==='recurring'?'recurrente':'extraordinaria'})`);let info=`${iso}\n${lines.join('\n')||'Sin aportaciones pendientes'}\nRealizadas: ${done.length+extraDone.length}`;if(!pending.length)return alert(info);let answer=prompt(info+'\n\nEscribe el número para marcarla como realizada. Cancelar para salir.');if(answer===null)return;let index=Number(answer)-1;if(!Number.isInteger(index)||index<0||index>=pending.length)return alert('Selecciona un número válido.');finishContribution(pending[index],iso,pending[index].kind)}
function completeScheduled(id){let x=s.scheduled.find(x=>x.id===id);if(!x||x.status==='done')return;finishContribution(x,x.date,'extra')}
function skipScheduled(id){let x=s.scheduled.find(x=>x.id===id);if(x&&x.status==='pending'&&confirm('¿Marcar como omitida? No afectará la proyección.')){x.status='skipped';save()}}

function saveOtherSettings(){let g=num('goal'),reserve=num('reserve'),tol=num('tol');if(![g,reserve,tol].every(Number.isFinite)||g<=0||reserve<0||tol<0)return alert('Revisa los valores');s.goal=g;s.reserve=reserve;s.tol=tol;save()}
function addMilestone(){let label=$('newMilestoneLabel').value.trim(),amount=num('newMilestoneAmount');if(!label||!Number.isFinite(amount)||amount<=0)return alert('Introduce un nombre y un importe válido.');if(s.milestones.length>=40)return alert('Máximo 40 hitos.');s.milestones.push({id:Date.now(),label:label.slice(0,70),amount});save()}
function removeMilestone(id){if(confirm('¿Eliminar este hito?')){s.milestones=s.milestones.filter(x=>x.id!==id);save()}}
function addScheduled(){let label=$('scheduledLabel').value.trim(),date=$('scheduledDate').value,amount=num('scheduledAmount'),target=$('scheduledTarget').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(new Date(date+'T12:00:00').getTime())||!positive(amount))return alert('Introduce fecha e importe válido.');if(s.scheduled.length>=300)return alert('Máximo 300 aportaciones programadas.');s.scheduled.push({id:Date.now(),label:label.slice(0,70),date,amount,target,status:'pending'});save()}
function removeScheduled(id){if(confirm('¿Eliminar esta aportación programada? Los movimientos ya realizados permanecerán en Actividad.')){s.scheduled=s.scheduled.filter(x=>x.id!==id);save()}}

function render(){let t=total(),h='';$('eye').innerHTML=privacy?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.7a2 2 0 002.7 2.7"/><path d="M9.9 5.3A11 11 0 0112 5c5.2 0 9 7 9 7a14 14 0 01-3.2 3.7M6.2 6.2C3.7 8 3 12 3 12s3.8 7 9 7a10 10 0 004.1-.9"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'; $('eye').setAttribute('aria-label',privacy?'Mostrar saldos':'Ocultar saldos');$('nav').innerHTML=['Inicio','Cartera','Actividad','Horizonte'].map(n=>`<button class="${tab===n?'active':''}" onclick="tab='${n}';render()">${n}</button>`).join('');if(tab==='Inicio'){let effectiveRate=weightedRate(),v=t,c=t,arr=[[v,c]];for(let i=0;i<24;i++){let a=s.monthly+(i===0?s.extra:0);v=v*Math.pow(1+effectiveRate/100,1/12)+a;c+=a;arr.push([v,c])}let scale=Math.max(1,v,t),path=j=>arr.map((a,i)=>`${i?'L':'M'}${10+i*10} ${125-a[j]/scale*110}`).join(' ');h=`<details class="home-total"><summary class="home-total-head"><small>Patrimonio invertido</small><h2>${money(t)} <span class="home-total-chevron">⌄</span></h2><small class="home-total-hint">Toca el monto para ver tus rendimientos</small></summary><div class="home-total-detail"><div class="home-weighted"><small>Tasa anual ponderada</small><b class="green">${privacy?'••••':effectiveRate.toFixed(2)+'%'}</b></div><div class="yield-overview"><div><small>Rendimiento mensual estimado</small><b>${money(s.p.reduce((a,p)=>a+annualYield(p),0)/12)}</b></div><div><small>Rendimiento anual estimado</small><b>${money(s.p.reduce((a,p)=>a+annualYield(p),0))}</b></div></div><small class="home-estimate-note">Estimaciones basadas en las tasas actuales. El rendimiento mensual equivale al anual dividido entre 12.</small></div></details>${renderGains()}<section><small>Proyección a dos años</small><h2>${money(v)}</h2><p class="green">${money(v-c)} de rendimientos estimados</p><svg viewBox="0 0 260 140" style="${privacy?'filter:blur(12px);opacity:.25':''}"><path d="${path(0)} L250 125 L10 125 Z" fill="#d5ded5"/><path d="${path(1)} L250 125 L10 125 Z" fill="#e3e3e0"/><path d="${path(0)}" fill="none" stroke="#728477" stroke-width="2"/></svg><small>Capital y aportaciones: ${money(c)}</small></section><section><small>Dinero libre · independiente</small><h2>${money(s.free)}</h2>${field('Importe','freeamt')}<button onclick="freeMove(1)">Añadir</button> <button onclick="freeMove(-1)">Disponer</button></section><section><small>Margen de disposición estimado</small><h2>${money(margin())}</h2><button onclick="tab='Horizonte';render()">Ver condiciones</button></section>`}if(tab==='Cartera'){h=`<div class="center"><small>Mis inversiones</small><h2>${money(t)}</h2></div><section>${s.p.map(p=>`<details><summary class="line portfolio-summary"><span>${esc(p.n)}</span><span class="portfolio-value"><b>${money(p.v)}</b><span class="portfolio-rate ${/^(bolsa|acciones|etf|etfs|gbm)$/i.test(p.n.trim())?'market':''} ${privacy?'hidden-number':''}">${privacy?'••••':/^(bolsa|acciones|etf|etfs|gbm)$/i.test(p.n.trim())?'Valor variable':p.r===''||p.r===undefined||p.r===null?'Tasa pendiente':p.v>0?(annualYield(p)/p.v*100).toFixed(2)+'% anual':'0.00% anual'}</span></span></summary><p>Participación: ${privacy?'•••':t?(p.v/t*100).toFixed(1):0}%</p>${privacy?'<p class="privacy-note">Muestra los saldos para editar los detalles.</p>':field('Nombre','n'+p.id,p.n,'text')+field('Tasa anual estimada (%)','r'+p.id,p.r)+`<label><input style="width:auto" type="checkbox" id="tier${p.id}" ${p.tiered?'checked':''}> Rendimiento por tramos</label>`+field('Límite de tasa preferencial (MXN)','cap'+p.id,p.cap??25000)+field('Tasa anual del excedente (%)','low'+p.id,p.low??0)}<label><input style="width:auto" type="checkbox" id="l${p.id}" ${p.liq?'checked':''}> Liquidez inmediata confirmada</label><div class="yield-overview yield-investment"><div><small>Rendimiento mensual estimado</small><b>${p.r===''?'—':money(annualYield(p)/12)}</b></div><div><small>Rendimiento anual estimado</small><b>${p.r===''?'—':money(annualYield(p))}</b></div></div>${privacy?'':`<button onclick="edit(${p.id})">Guardar detalles</button><div class="balance-tools"><h3>Gestionar saldo</h3><p class="muted">Corregir saldo ajusta el registro, no representa una aportación ni una ganancia.</p>${field('Saldo real actual (MXN)','balance'+p.id,p.v)}<button onclick="correctBalance(${p.id})">Corregir saldo</button><hr style="border:0;border-top:1px solid #e6e6e4;margin:24px 0"><h3>Traspasar dinero</h3>${field('Importe a transferir (MXN)','transfer'+p.id,'')}<label>Destino<select id="target${p.id}"><option value="free">Dinero libre</option>${s.p.filter(x=>x.id!==p.id).map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select></label><button onclick="transferFrom(${p.id})">Confirmar traspaso</button></div>`}${isMarket(p)?marketPanel(p):''}</details>`).join('')}</section><section><h3>Nueva inversión</h3>${field('Nombre','newname','','text')}${field('Saldo inicial externo','newval',0)}<button onclick="add()">+ Añadir inversión</button><p class="muted">Si es un traspaso interno, crea la inversión con saldo cero.</p></section>`}if(tab==='Actividad'){h=`<section><h3>Nuevo movimiento</h3><label>Tipo<select id="kind"><option>Aportación</option><option>Rendimiento</option><option>Pérdida</option><option>Retiro</option><option>Traspaso</option><option>A dinero libre</option><option>Desde dinero libre</option></select></label><label>Inversión<select id="acc">${opts()}</select></label><label>Destino (solo traspasos)<select id="dest">${opts()}</select></label>${field('Importe','amt')}<button onclick="move()">Registrar</button></section>${activityIsland('Aportaciones y retiros',s.logs.filter(l=>!marketLog(l)&&!freeLog(l)))}${activityIsland('Dinero libre',s.logs.filter(l=>!marketLog(l)&&freeLog(l)))}${activityIsland('Bolsa',s.logs.filter(marketLog))}`}if(tab==='Horizonte'){h=renderHorizon()}h+=`<section><small>Datos locales · ${available?'guardado en este navegador':'almacenamiento no disponible'}</small><p>Exporta un respaldo regularmente. El modo privacidad oculta la interfaz, pero no cifra el almacenamiento ni los respaldos.</p><button onclick="backup()">Exportar datos</button> <input type="file" accept="application/json" onchange="restore(this)"></section>`;$('view').innerHTML=h}function togglePrivacy(){privacy=!privacy;render()}
function openQuick(){quickKind='Aportación';quickTarget='free';drawQuick()}
function closeQuick(){$('overlay').innerHTML=''}
function drawQuick(){let targetOpts='<option value="free">Dinero libre</option>'+opts();$('overlay').innerHTML=`<div class="sheet-back" onclick="if(event.target===this)closeQuick()"><div class="sheet" role="dialog" aria-modal="true" aria-label="Movimiento rápido"><div class="line" style="padding-top:0"><h3>Movimiento rápido</h3><button class="eye" onclick="closeQuick()" aria-label="Cerrar">✕</button></div><p class="privacy-note">Los movimientos se registran localmente en este dispositivo.</p><label>Cuenta o inversión<select id="qtarget" onchange="quickTarget=this.value">${targetOpts}</select></label><div class="sheet-actions"><button class="pill ${quickKind==='Aportación'?'selected':''}" onclick="quickKind='Aportación';drawQuick()">+ Sumar</button><button class="pill ${quickKind==='Retiro'?'selected':''}" onclick="quickKind='Retiro';drawQuick()">− Restar</button></div>${field('Importe en MXN','qamount','')}<button class="wide" onclick="quickSave()">Guardar movimiento</button><button class="wide" style="margin-top:8px" onclick="closeQuick()">Cancelar</button></div></div>`;$('qtarget').value=quickTarget}
function quickSave(){let v=num('qamount'),isFree=quickTarget==='free',p=s.p.find(x=>String(x.id)===quickTarget);if(!positive(v)||!isFree&&!p)return alert('Ingresa un importe válido');if(!isFree&&isMarket(p)&&quickKind==='Retiro'&&v>p.v-holdings(p).reduce((a,x)=>a+x.value,0))return alert('Solo puedes retirar saldo sin asignar.');if(quickKind==='Retiro'&&v>(isFree?s.free:p.v))return alert('El importe supera el saldo disponible');if(isFree)s.free+=(quickKind==='Aportación'?v:-v);else p.v+=(quickKind==='Aportación'?v:-v);log(quickKind+(isFree?' libre':''),isFree?'Libre':p.n,v);closeQuick();save()}
function positive(v){return Number.isFinite(v)&&v>0}function freeMove(d){let v=num('freeamt');if(!positive(v)||d<0&&v>s.free)return alert('Revisa el importe');s.free+=d*v;log(d>0?'Añadir libre':'Disponer libre','Libre',v);save()}function edit(id){let p=s.p.find(x=>x.id===id),n=$('n'+id).value.trim(),r=$('r'+id).value;if(!n||r!==''&&(!Number.isFinite(Number(r))||Number(r)<0||Number(r)>100))return;p.n=n;p.r=r;p.liq=$('l'+id).checked;let tiered=$('tier'+id).checked,cap=num('cap'+id),low=num('low'+id);if(tiered&&(!Number.isFinite(cap)||cap<0||!Number.isFinite(low)||low<0||low>100||r===''||Number(r)<0||Number(r)>100))return alert('Revisa las tasas y el límite');p.tiered=tiered;p.cap=cap;p.low=low;save()}function add(){let n=$('newname').value.trim(),v=num('newval');if(!n||!Number.isFinite(v)||v<0)return;s.p.push({id:Date.now(),n,v,r:'',liq:false,tiered:false,cap:25000,low:0});if(v)log('Aportación',n,v);save()}function move(){let k=$('kind').value,p=s.p.find(x=>x.id==num('acc')),d=s.p.find(x=>x.id==num('dest')),v=num('amt');if(!p||!positive(v))return alert('Revisa el importe');let out=['Pérdida','Retiro','Traspaso','A dinero libre'].includes(k);if(isMarket(p)&&holdings(p).length&&(['Rendimiento','Pérdida'].includes(k)||out&&v>p.v-holdings(p).reduce((a,x)=>a+x.value,0)))return alert('Usa los controles de Bolsa o el saldo sin asignar.');if(out&&v>p.v||k==='Desde dinero libre'&&v>s.free||k==='Traspaso'&&(!d||p===d))return alert('Movimiento no válido');p.v+=out?-v:v;if(k==='Traspaso')d.v+=v;if(k==='A dinero libre')s.free+=v;if(k==='Desde dinero libre')s.free-=v;log(k,p.n+(k==='Traspaso'?' → '+d.n:''),v);save()}function correctBalance(id){let p=s.p.find(x=>x.id===id);if(!p)return;let v=num('balance'+id);if(!Number.isFinite(v)||v<0)return alert('Introduce un saldo válido.');if(isMarket(p)&&holdings(p).length)return alert('Actualiza el valor de cada posición desde Acciones y ETF.');let delta=Math.round((v-p.v)*100)/100;if(Math.abs(delta)<0.005)return alert('El saldo ya coincide.');let message='Saldo anterior: '+p.v.toFixed(2)+' MXN\nSaldo nuevo: '+v.toFixed(2)+' MXN\nDiferencia: '+delta.toFixed(2)+' MXN\n\n¿La diferencia corresponde SOLO a intereses o variación de valor, después de registrar todas tus aportaciones y retiros?\n\nAceptar = registrar como ganancia/pérdida.\nCancelar = elegir corrección sin rendimiento.';if(confirm(message)){if(!confirm('Confirmar rendimiento neto de '+delta.toFixed(2)+' MXN. Si hay aportaciones sin registrar, cancela y regístralas primero.'))return;p.v=v;log(delta>=0?'Ganancia conciliada':'Pérdida conciliada',p.n,Math.abs(delta));}else{if(!confirm('¿Guardar como CORRECCIÓN administrativa, sin contar la diferencia como rendimiento?'))return;p.v=v;log('Corrección de saldo',p.n,delta);}save()}
function transferFrom(id){let p=s.p.find(x=>x.id===id);if(!p)return;let v=num('transfer'+id),target=$('target'+id).value,d=target==='free'?null:s.p.find(x=>String(x.id)===target);if(isMarket(p)&&v>p.v-holdings(p).reduce((a,x)=>a+x.value,0))return alert('Solo puedes transferir saldo sin asignar.');if(!positive(v)||v>p.v)return alert('El importe debe ser positivo y no superar el saldo de origen.');if(target!=='free'&&(!d||d.id===p.id))return alert('Selecciona un destino diferente.');let dest=d?d.n:'Dinero libre';if(!confirm('¿Transferir '+v.toLocaleString('es-MX',{style:'currency',currency:'MXN'})+' de '+p.n+' a '+dest+'?'))return;p.v=Math.round((p.v-v)*100)/100;if(d)d.v=Math.round((d.v+v)*100)/100;else s.free=Math.round((s.free+v)*100)/100;log('Traspaso interno',p.n+' → '+dest,v);save()}function settings(){let keys=['goal','monthly','extra','rate','reserve','tol'],a=keys.map(num);if(a.some(v=>!Number.isFinite(v)||v<0)||a[0]<=0||a[3]>100)return alert('Revisa los valores');keys.forEach((k,i)=>s[k]=a[i]);save()}function simulate(){let w=num('sim');if(w<0||w>total()||!Number.isFinite(w))return;let n=project(w),b=project();$('simresult').textContent=(n>=600?'Fuera del horizonte':n+' meses; retraso: '+(n-b)+' meses')+(w>margin()?'. Supera el margen estimado.':'')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='capital-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.p)||!Array.isArray(x.logs)||!['free','goal','monthly','extra','rate','reserve','tol'].every(k=>Number.isFinite(x[k])&&x[k]>=0)||x.goal<=0||!x.p.every(p=>typeof p.n==='string'&&Number.isFinite(p.v)&&p.v>=0))throw Error();if(confirm('¿Reemplazar los datos actuales?')){s=x;if(!Array.isArray(s.milestones))s.milestones=structuredClone(seed.milestones);if(!Array.isArray(s.scheduled))s.scheduled=[];if(!Array.isArray(s.recurring)){let base=Math.max(0,Number(s.monthly)||0);s.recurring=[{id:1,day:15,amount:base/2,target:"",label:"Primera quincena",active:true},{id:2,day:30,amount:base/2,target:"",label:"Segunda quincena",active:true}]}if(!Array.isArray(s.completedContributions))s.completedContributions=[];for(const item of s.scheduled){if(!item.status)item.status="pending"}save()}}catch(e){alert('Respaldo inválido')}}render();</script></html>
