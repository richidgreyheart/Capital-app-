<div id="view"></div></main><nav id="nav"></nav><button class="fab" id="quick" onclick="openQuick()" aria-label="Registrar movimiento rápido">+</button><div id="overlay"></div><script>
const seed={p:[],free:0,logs:[],goal:1000000,monthly:8000,extra:0,rate:8,reserve:0,tol:0,monthlyDay:15,milestones:[{id:545000,label:"Recuperar patrimonio anterior",amount:545000},{id:600000,label:"600 mil",amount:600000},{id:700000,label:"700 mil",amount:700000},{id:800000,label:"800 mil",amount:800000},{id:900000,label:"900 mil",amount:900000},{id:1000000,label:"Primer millón",amount:1000000}],scheduled:[]};let s;try{s=JSON.parse(localStorage.getItem('capital-v2'))||structuredClone(seed)}catch(e){s=structuredClone(seed)}
if(!Array.isArray(s.milestones))s.milestones=structuredClone(seed.milestones);if(!Array.isArray(s.scheduled))s.scheduled=[];if(!Number.isInteger(s.monthlyDay)||s.monthlyDay<1||s.monthlyDay>28)s.monthlyDay=15;let tab='Inicio',available=true;let privacy=true;let quickKind='Aportación';let quickTarget='free';let horizonMonth=0;function save(){try{localStorage.setItem('capital-v2',JSON.stringify(s))}catch(e){available=false}render()}const $=id=>document.getElementById(id), money=n=>privacy?'<span class="hidden-number">••••••</span>':Number(n).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),total=()=>s.p.reduce((a,p)=>a+p.v,0),num=id=>Number($(id).value),opts=()=>s.p.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('');function annualYield(p){let v=Math.max(0,Number(p.v)||0),r=Number(p.r)||0;if(p.tiered){let cap=Math.max(0,Number(p.cap)||0),low=Number(p.low)||0;return Math.min(v,cap)*r/100+Math.max(0,v-cap)*low/100}return v*r/100}function weightedRate(){let t=total();return t?s.p.reduce((a,p)=>a+annualYield(p),0)/t*100:0}function project(w=0,r=s.rate){let v=total()-w,i=0;while(v<s.goal&&i<600){v=v*Math.pow(1+r/100,1/12)+s.monthly+(i===0?s.extra:0);i++}return i}function limit(r){let b=project(0,r),lo=0,hi=total();if(b>=600)return 0;for(let i=0;i<40;i++){let m=(lo+hi)/2;if(project(m,r)<=b+s.tol)lo=m;else hi=m}return lo}function margin(){return Math.max(0,Math.floor(Math.min(limit(s.rate),limit(Math.max(0,s.rate-3)),s.p.filter(p=>p.liq).reduce((a,p)=>a+p.v,0)-s.reserve)/100)*100)}function log(k,n,v){s.logs.unshift({k,n,v,date:new Date().toISOString()})}function field(label,id,v='',type='number'){return `<label>${label}<input id="${id}" type="${type}" value="${esc(v)}"></label>`}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function dateKey(d){return monthKey(d)+'-'+String(d.getDate()).padStart(2,'0')}
function addMonths(d,n,day){return new Date(d.getFullYear(),d.getMonth()+n,Math.min(day??d.getDate(),28))}
function dateLabel(d){return d.toLocaleDateString('es-MX',{month:'short',year:'numeric'})}
function horizonProjection(){
 const today=new Date(),start=new Date(today.getFullYear(),today.getMonth(),today.getDate());
 const targets=s.milestones.filter(x=>Number.isFinite(x.amount)&&x.amount>0).sort((a,b)=>a.amount-b.amount);
 const hits={};let balance=total(),points=[{date:start,value:balance}],rate=Math.max(0,Math.min(100,Number(s.rate)||0));
 for(const t of targets){if(balance>=t.amount)hits[t.id]={date:start,already:true}}
 // Fecha mensual aproximada: aportación al día elegido; rendimiento prorrateado mensualmente.
 for(let i=1;i<=600;i++){
  const date=new Date(start.getFullYear(),start.getMonth()+i,Math.min(s.monthlyDay,28));
  balance=balance*Math.pow(1+rate/100,1/12)+(Number(s.monthly)||0)+(i===1?(Number(s.extra)||0):0);
  const key=monthKey(date);
  balance+=s.scheduled.filter(x=>typeof x.date==='string'&&x.date.slice(0,7)===key).reduce((a,x)=>a+(Number(x.amount)||0),0);
  points.push({date,value:balance});
  for(const t of targets){if(!hits[t.id]&&balance>=t.amount)hits[t.id]={date,already:false}}
  if(Object.keys(hits).length===targets.length&&i>=24)break;

function horizonCalendar(){
 const now=new Date(),d=new Date(now.getFullYear(),now.getMonth()+horizonMonth,1),offset=(d.getDay()+6)%7,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),pr=horizonProjection();
 const marked=pr.targets.filter(t=>pr.hits[t.id]&&monthKey(pr.hits[t.id].date)===monthKey(d)&&!pr.hits[t.id].already);
 let html=`<div class="cal-head"><button onclick="horizonMonth--;render()" aria-label="Mes anterior">‹</button><strong>${esc(d.toLocaleDateString('es-MX',{month:'long',year:'numeric'}))}</strong><button onclick="horizonMonth++;render()" aria-label="Mes siguiente">›</button></div><div class="calendar-grid">`;
 for(const x of ['L','M','M','J','V','S','D'])html+=`<span class="cal-week">${x}</span>`;
 for(let i=0;i<offset;i++)html+='<span></span>';
 for(let day=1;day<=days;day++){
  const iso=dateKey(new Date(d.getFullYear(),d.getMonth(),day));
  const monthly=!privacy&&day===s.monthlyDay&&(s.monthly>0),special=!privacy&&s.scheduled.some(x=>x.date===iso),hit=!privacy&&marked.some(t=>pr.hits[t.id].date.getDate()===day);
  html+=`<div class="cal-day ${monthly?'contribution':''} ${special?'special':''} ${hit?'milestone':''}"><span>${day}</span><span class="cal-dots">${monthly?'<i class="dot green-dot"></i>':''}${special?'<i class="dot dark-dot"></i>':''}${hit?'<i class="dot red-dot"></i>':''}</span></div>`;
 }
 html+='</div><p class="muted">● Verde: aportación mensual · ● Negro: extraordinaria · ● Terracota: hito estimado</p>';
 const extras=s.scheduled.filter(x=>x.date.slice(0,7)===monthKey(d));
 if(!privacy&&(extras.length||marked.length))html+=`<div class="cal-events">${extras.map(x=>`<p>• ${esc(x.date)} · ${esc(x.label||'Aportación extraordinaria')} · ${money(x.amount)}</p>`).join('')}${marked.map(t=>`<p>• Hito previsto: ${esc(t.label)} (${money(t.amount)})</p>`).join('')}</div>`;
 return html;
}
function horizonGraph(pr){
 const pts=pr.points.slice(0,Math.min(pr.points.length,61)),max=Math.max(1,...pts.map(x=>x.value)),min=0;
 const coords=pts.map((x,i)=>[12+i*296/Math.max(1,pts.length-1),146-(x.value-min)/(max-min)*126]);
 const path=coords.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 const lines=pr.targets.filter(t=>t.amount<=max).slice(0,7).map(t=>{let y=146-t.amount/max*126;return `<line x1="12" x2="308" y1="${y}" y2="${y}" stroke="#dededb" stroke-dasharray="3 5"/><text x="14" y="${y-3}" font-size="9" fill="#888">${Math.round(t.amount/1000)}k</text>`}).join('');

}
function renderHorizon(){

 let h=`<div class="center"><small>Horizonte · patrimonio en el tiempo</small><h2>${money(t)}</h2><p class="green">${privacy?'••••':rate.toFixed(2)+'%'} anual supuesto</p></div>`;

function saveHorizonPlan(){let m=num('monthly'),day=num('monthlyDay'),r=num('rate'),extra=num('extra');if(![m,day,r,extra].every(Number.isFinite)||m<0||extra<0||r<0||r>100||!Number.isInteger(day)||day<1||day>28)return alert('Revisa los importes, tasa y día del mes (1–28).');s.monthly=m;s.monthlyDay=day;s.rate=r;s.extra=extra;save()}
function saveOtherSettings(){let g=num('goal'),reserve=num('reserve'),tol=num('tol');if(![g,reserve,tol].every(Number.isFinite)||g<=0||reserve<0||tol<0)return alert('Revisa los valores');s.goal=g;s.reserve=reserve;s.tol=tol;save()}
function addMilestone(){let label=$('newMilestoneLabel').value.trim(),amount=num('newMilestoneAmount');if(!label||!Number.isFinite(amount)||amount<=0)return alert('Introduce un nombre y un importe válido.');if(s.milestones.length>=40)return alert('Máximo 40 hitos.');s.milestones.push({id:Date.now(),label:label.slice(0,70),amount});save()}

function removeScheduled(id){if(confirm('¿Eliminar esta aportación programada?')){s.scheduled=s.scheduled.filter(x=>x.id!==id);save()}}
function render(){let t=total(),h='';$('eye').innerHTML=privacy?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.7a2 2 0 002.7 2.7"/><path d="M9.9 5.3A11 11 0 0112 5c5.2 0 9 7 9 7a14 14 0 01-3.2 3.7M6.2 6.2C3.7 8 3 12 3 12s3.8 7 9 7a10 10 0 004.1-.9"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'; $('eye').setAttribute('aria-label',privacy?'Mostrar saldos':'Ocultar saldos');$('nav').innerHTML=['Inicio','Cartera','Actividad','Horizonte'].map(n=>`<button class="${tab===n?'active':''}" onclick="tab='${n}';render()">${n}</button>`).join('');if(tab==='Inicio'){let effectiveRate=weightedRate(),v=t,c=t,arr=[[v,c]];for(let i=0;i<24;i++){let a=s.monthly+(i===0?s.extra:0);v=v*Math.pow(1+effectiveRate/100,1/12)+a;c+=a;arr.push([v,c])}let scale=Math.max(1,v,t),path=j=>arr.map((a,i)=>`${i?'L':'M'}${10+i*10} ${125-a[j]/scale*110}`).join(' ');h=`<div class="center"><small>Patrimonio invertido</small><h2>${money(t)}</h2><p class="green">${privacy?'••••••':effectiveRate.toFixed(2)+'%'} anual ponderado</p><small>Rendimiento anual estimado: ${money(s.p.reduce((a,p)=>a+annualYield(p),0))}</small></div><section><small>Proyección a dos años</small><h2>${money(v)}</h2><p class="green">${money(v-c)} de rendimientos estimados</p><svg viewBox="0 0 260 140" style="${privacy?'filter:blur(12px);opacity:.25':''}"><path d="${path(0)} L250 125 L10 125 Z" fill="#d5ded5"/><path d="${path(1)} L250 125 L10 125 Z" fill="#e3e3e0"/><path d="${path(0)}" fill="none" stroke="#728477" stroke-width="2"/></svg><small>Capital y aportaciones: ${money(c)}</small></section><section><small>Dinero libre · independiente</small><h2>${money(s.free)}</h2>${field('Importe','freeamt')}<button onclick="freeMove(1)">Añadir</button> <button onclick="freeMove(-1)">Disponer</button></section><section><small>Margen de disposición estimado</small><h2>${money(margin())}</h2><button onclick="tab='Horizonte';render()">Ver condiciones</button></section>`}if(tab==='Cartera'){h=`<div class="center"><small>Mis inversiones</small><h2>${money(t)}</h2></div><section>${s.p.map(p=>`<details><summary class="line portfolio-summary"><span>${esc(p.n)}</span><span class="portfolio-value"><b>${money(p.v)}</b><span class="portfolio-rate ${/^(bolsa|acciones|etf|etfs|gbm)$/i.test(p.n.trim())?'market':''} ${privacy?'hidden-number':''}">${privacy?'••••':/^(bolsa|acciones|etf|etfs|gbm)$/i.test(p.n.trim())?'Valor variable':p.r===''||p.r===undefined||p.r===null?'Tasa pendiente':p.v>0?(annualYield(p)/p.v*100).toFixed(2)+'% anual':'0.00% anual'}</span></span></summary><p>Participación: ${privacy?'•••':t?(p.v/t*100).toFixed(1):0}%</p>${privacy?'<p class="privacy-note">Muestra los saldos para editar los detalles.</p>':field('Nombre','n'+p.id,p.n,'text')+field('Tasa anual estimada (%)','r'+p.id,p.r)+`<label><input style="width:auto" type="checkbox" id="tier${p.id}" ${p.tiered?'checked':''}> Rendimiento por tramos</label>`+field('Límite de tasa preferencial (MXN)','cap'+p.id,p.cap??25000)+field('Tasa anual del excedente (%)','low'+p.id,p.low??0)}<label><input style="width:auto" type="checkbox" id="l${p.id}" ${p.liq?'checked':''}> Liquidez inmediata confirmada</label><p>Rendimiento anual estimado: ${p.r===''?'—':money(annualYield(p))}</p>${privacy?'':`<button onclick="edit(${p.id})">Guardar detalles</button><div class="balance-tools"><h3>Gestionar saldo</h3><p class="muted">Corregir saldo ajusta el registro, no representa una aportación ni una ganancia.</p>${field('Saldo real actual (MXN)','balance'+p.id,p.v)}<button onclick="correctBalance(${p.id})">Corregir saldo</button><hr style="border:0;border-top:1px solid #e6e6e4;margin:24px 0"><h3>Traspasar dinero</h3>${field('Importe a transferir (MXN)','transfer'+p.id,'')}<label>Destino<select id="target${p.id}"><option value="free">Dinero libre</option>${s.p.filter(x=>x.id!==p.id).map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select></label><button onclick="transferFrom(${p.id})">Confirmar traspaso</button></div>`}</details>`).join('')}</section><section><h3>Nueva inversión</h3>${field('Nombre','newname','','text')}${field('Saldo inicial externo','newval',0)}<button onclick="add()">+ Añadir inversión</button><p class="muted">Si es un traspaso interno, crea la inversión con saldo cero.</p></section>`}if(tab==='Actividad'){h=`<section><h3>Nuevo movimiento</h3><label>Tipo<select id="kind"><option>Aportación</option><option>Rendimiento</option><option>Pérdida</option><option>Retiro</option><option>Traspaso</option><option>A dinero libre</option><option>Desde dinero libre</option></select></label><label>Inversión<select id="acc">${opts()}</select></label><label>Destino (solo traspasos)<select id="dest">${opts()}</select></label>${field('Importe','amt')}<button onclick="move()">Registrar</button></section><section><small>Historial</small>${s.logs.map(l=>`<div class="line"><span>${esc(l.k)}<br><small>${esc(l.n)} · ${new Date(l.date).toLocaleDateString('es-MX')}</small></span><span>${money(l.v)}</span></div>`).join('')||'<p>Sin movimientos.</p>'}</section>`}if(tab==='Horizonte'){h=renderHorizon()}h+=`<section><small>Datos locales · ${available?'guardado en este navegador':'almacenamiento no disponible'}</small><p>Exporta un respaldo regularmente. El modo privacidad oculta la interfaz, pero no cifra el almacenamiento ni los respaldos.</p><button onclick="backup()">Exportar datos</button> <input type="file" accept="application/json" onchange="restore(this)"></section>`;$('view').innerHTML=h}function togglePrivacy(){privacy=!privacy;render()}
function openQuick(){quickKind='Aportación';quickTarget='free';drawQuick()}
function closeQuick(){$('overlay').innerHTML=''}
function drawQuick(){let targetOpts='<option value="free">Dinero libre</option>'+opts();$('overlay').innerHTML=`<div class="sheet-back" onclick="if(event.target===this)closeQuick()"><div class="sheet" role="dialog" aria-modal="true" aria-label="Movimiento rápido"><div class="line" style="padding-top:0"><h3>Movimiento rápido</h3><button class="eye" onclick="closeQuick()" aria-label="Cerrar">✕</button></div><p class="privacy-note">Los movimientos se registran localmente en este dispositivo.</p><label>Cuenta o inversión<select id="qtarget" onchange="quickTarget=this.value">${targetOpts}</select></label><div class="sheet-actions"><button class="pill ${quickKind==='Aportación'?'selected':''}" onclick="quickKind='Aportación';drawQuick()">+ Sumar</button><button class="pill ${quickKind==='Retiro'?'selected':''}" onclick="quickKind='Retiro';drawQuick()">− Restar</button></div>${field('Importe en MXN','qamount','')}<button class="wide" onclick="quickSave()">Guardar movimiento</button><button class="wide" style="margin-top:8px" onclick="closeQuick()">Cancelar</button></div></div>`;$('qtarget').value=quickTarget}
function quickSave(){let v=num('qamount'),isFree=quickTarget==='free',p=s.p.find(x=>String(x.id)===quickTarget);if(!positive(v)||!isFree&&!p)return alert('Ingresa un importe válido');if(quickKind==='Retiro'&&v>(isFree?s.free:p.v))return alert('El importe supera el saldo disponible');if(isFree)s.free+=(quickKind==='Aportación'?v:-v);else p.v+=(quickKind==='Aportación'?v:-v);log(quickKind+(isFree?' libre':''),isFree?'Libre':p.n,v);closeQuick();save()}
function positive(v){return Number.isFinite(v)&&v>0}function freeMove(d){let v=num('freeamt');if(!positive(v)||d<0&&v>s.free)return alert('Revisa el importe');s.free+=d*v;log(d>0?'Añadir libre':'Disponer libre','Libre',v);save()}function edit(id){let p=s.p.find(x=>x.id===id),n=$('n'+id).value.trim(),r=$('r'+id).value;if(!n||r!==''&&(!Number.isFinite(Number(r))||Number(r)<0||Number(r)>100))return;p.n=n;p.r=r;p.liq=$('l'+id).checked;let tiered=$('tier'+id).checked,cap=num('cap'+id),low=num('low'+id);if(tiered&&(!Number.isFinite(cap)||cap<0||!Number.isFinite(low)||low<0||low>100||r===''||Number(r)<0||Number(r)>100))return alert('Revisa las tasas y el límite');p.tiered=tiered;p.cap=cap;p.low=low;save()}function add(){let n=$('newname').value.trim(),v=num('newval');if(!n||!Number.isFinite(v)||v<0)return;s.p.push({id:Date.now(),n,v,r:'',liq:false,tiered:false,cap:25000,low:0});if(v)log('Aportación',n,v);save()}function move(){let k=$('kind').value,p=s.p.find(x=>x.id==num('acc')),d=s.p.find(x=>x.id==num('dest')),v=num('amt');if(!p||!positive(v))return alert('Revisa el importe');let out=['Pérdida','Retiro','Traspaso','A dinero libre'].includes(k);if(out&&v>p.v||k==='Desde dinero libre'&&v>s.free||k==='Traspaso'&&(!d||p===d))return alert('Movimiento no válido');p.v+=out?-v:v;if(k==='Traspaso')d.v+=v;if(k==='A dinero libre')s.free+=v;if(k==='Desde dinero libre')s.free-=v;log(k,p.n+(k==='Traspaso'?' → '+d.n:''),v);save()}function correctBalance(id){let p=s.p.find(x=>x.id===id);if(!p)return;let v=num('balance'+id);if(!Number.isFinite(v)||v<0)return alert('Introduce un saldo válido.');let delta=v-p.v;if(Math.abs(delta)<0.005)return alert('El saldo ya coincide.');if(!confirm('¿Corregir el saldo de '+p.n+' de '+p.v.toFixed(2)+' a '+v.toFixed(2)+' MXN? Esto no se contará como aportación ni rendimiento.'))return;p.v=v;log('Corrección de saldo',p.n,Math.round(delta*100)/100);save()}function transferFrom(id){let p=s.p.find(x=>x.id===id);if(!p)return;let v=num('transfer'+id),target=$('target'+id).value,d=target==='free'?null:s.p.find(x=>String(x.id)===target);if(!positive(v)||v>p.v)return alert('El importe debe ser positivo y no superar el saldo de origen.');if(target!=='free'&&(!d||d.id===p.id))return alert('Selecciona un destino diferente.');let dest=d?d.n:'Dinero libre';if(!confirm('¿Transferir '+v.toLocaleString('es-MX',{style:'currency',currency:'MXN'})+' de '+p.n+' a '+dest+'?'))return;p.v=Math.round((p.v-v)*100)/100;if(d)d.v=Math.round((d.v+v)*100)/100;else s.free=Math.round((s.free+v)*100)/100;log('Traspaso interno',p.n+' → '+dest,v);save()}function settings(){let keys=['goal','monthly','extra','rate','reserve','tol'],a=keys.map(num);if(a.some(v=>!Number.isFinite(v)||v<0)||a[0]<=0||a[3]>100)return alert('Revisa los valores');keys.forEach((k,i)=>s[k]=a[i]);save()}function simulate(){let w=num('sim');if(w<0||w>total()||!Number.isFinite(w))return;let n=project(w),b=project();$('simresult').textContent=(n>=600?'Fuera del horizonte':n+' meses; retraso: '+(n-b)+' meses')+(w>margin()?'. Supera el margen estimado.':'')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='capital-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.p)||!Array.isArray(x.logs)||!['free','goal','monthly','extra','rate','reserve','tol'].every(k=>Number.isFinite(x[k])&&x[k]>=0)||x.goal<=0||!x.p.every(p=>typeof p.n==='string'&&Number.isFinite(p.v)&&p.v>=0))throw Error();if(confirm('¿Reemplazar los datos actuales?')){s=x;save()}}catch(e){alert('Respaldo inválido')}}render();</script></html>
