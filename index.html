<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-title" content="Capital."><title>Capital.</title><style>*{box-sizing:border-box}body{margin:0;background:white;color:#171717;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:620px;margin:auto;padding:36px 34px 110px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;font-weight:600}h2{font-size:32px;font-weight:400;margin:10px 0}h3{font-size:18px;font-weight:500}small,p{color:#777;line-height:1.5}section{background:#f7f7f6;border-radius:28px;padding:24px;margin:32px 0} .center{text-align:center;margin:44px 0}.line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #e6e6e4}button,input,select{font:inherit;border:1px solid #dededb;border-radius:14px;padding:12px;background:white;color:#171717;max-width:100%}button{cursor:pointer}input,select{width:100%;margin:6px 0 14px}label{color:#777;font-size:13px}nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 64px);max-width:550px;display:flex;background:#f1f1ef;border-radius:30px;padding:7px;gap:2px}nav button{flex:1;border:0;background:transparent;padding:12px 4px;font-size:12px}nav .active{background:white}.green{color:#728477}.red{color:#ac6455}progress{width:100%;height:8px;accent-color:#728477}summary{cursor:pointer}svg{width:100%;height:auto} .wide{width:100%} .muted{font-size:12px}.eye{border:0;background:transparent;padding:9px;color:#777;display:flex;align-items:center;justify-content:center}.eye svg{width:19px;height:19px}.header-actions{display:flex;align-items:center;gap:8px}.fab{position:fixed;right:max(34px,calc((100vw - 620px)/2 + 34px));bottom:105px;border:0;border-radius:50%;width:52px;height:52px;background:#171717;color:white;font-size:27px;box-shadow:0 4px 16px #0002;z-index:4}.sheet-back{position:fixed;inset:0;background:#0005;z-index:9;display:flex;align-items:flex-end;justify-content:center;padding:18px}.sheet{background:#fff;width:100%;max-width:550px;border-radius:28px;padding:24px;max-height:85vh;overflow:auto;box-shadow:0 8px 30px #0002}.sheet h3{margin-top:0}.sheet-actions{display:flex;gap:8px}.sheet-actions button{flex:1}.pill{border:0;border-radius:22px;padding:10px 14px;background:#f1f1ef}.pill.selected{background:#dce5dc}.privacy-note{font-size:12px;color:#888}.hidden-number{letter-spacing:2px;color:#999}.line b{font-weight:500} </style><main><header><h1>Capital.</h1><div class="header-actions"><button id="eye" class="eye" aria-label="Mostrar saldos" title="Mostrar u ocultar saldos" onclick="togglePrivacy()"></button><small>MXN</small></div></header><div id="view"></div></main><nav id="nav"></nav><button class="fab" id="quick" onclick="openQuick()" aria-label="Registrar movimiento rápido">+</button><div id="overlay"></div><script>
const seed={p:[],free:0,logs:[],goal:1000000,monthly:8000,extra:0,rate:8,reserve:0,tol:0};let s;try{s=JSON.parse(localStorage.getItem('capital-v2'))||structuredClone(seed)}catch(e){s=structuredClone(seed)}
let tab='Inicio',available=true;let privacy=true;let quickKind='Aportación';let quickTarget='free';function save(){try{localStorage.setItem('capital-v2',JSON.stringify(s))}catch(e){available=false}render()}const $=id=>document.getElementById(id), money=n=>privacy?'<span class="hidden-number">••••••</span>':Number(n).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),total=()=>s.p.reduce((a,p)=>a+p.v,0),num=id=>Number($(id).value),opts=()=>s.p.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('');function project(w=0,r=s.rate){let v=total()-w,i=0;while(v<s.goal&&i<600){v=v*Math.pow(1+r/100,1/12)+s.monthly+(i===0?s.extra:0);i++}return i}function limit(r){let b=project(0,r),lo=0,hi=total();if(b>=600)return 0;for(let i=0;i<40;i++){let m=(lo+hi)/2;if(project(m,r)<=b+s.tol)lo=m;else hi=m}return lo}function margin(){return Math.max(0,Math.floor(Math.min(limit(s.rate),limit(Math.max(0,s.rate-3)),s.p.filter(p=>p.liq).reduce((a,p)=>a+p.v,0)-s.reserve)/100)*100)}function log(k,n,v){s.logs.unshift({k,n,v,date:new Date().toISOString()})}function field(label,id,v='',type='number'){return `<label>${label}<input id="${id}" type="${type}" value="${esc(v)}"></label>`}function render(){let t=total(),h='';$('eye').innerHTML=privacy?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.7a2 2 0 002.7 2.7"/><path d="M9.9 5.3A11 11 0 0112 5c5.2 0 9 7 9 7a14 14 0 01-3.2 3.7M6.2 6.2C3.7 8 3 12 3 12s3.8 7 9 7a10 10 0 004.1-.9"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'; $('eye').setAttribute('aria-label',privacy?'Mostrar saldos':'Ocultar saldos');$('nav').innerHTML=['Inicio','Cartera','Actividad','Metas'].map(n=>`<button class="${tab===n?'active':''}" onclick="tab='${n}';render()">${n}</button>`).join('');if(tab==='Inicio'){let v=t,c=t,arr=[[v,c]];for(let i=0;i<24;i++){let a=s.monthly+(i===0?s.extra:0);v=v*Math.pow(1+s.rate/100,1/12)+a;c+=a;arr.push([v,c])}let scale=Math.max(1,v,t),path=j=>arr.map((a,i)=>`${i?'L':'M'}${10+i*10} ${125-a[j]/scale*110}`).join(' ');h=`<div class="center"><small>Patrimonio invertido</small><h2>${money(t)}</h2></div><section><small>Proyección a dos años</small><h2>${money(v)}</h2><p class="green">${money(v-c)} de rendimientos estimados</p><svg viewBox="0 0 260 140" style="${privacy?'filter:blur(12px);opacity:.25':''}"><path d="${path(0)} L250 125 L10 125 Z" fill="#d5ded5"/><path d="${path(1)} L250 125 L10 125 Z" fill="#e3e3e0"/><path d="${path(0)}" fill="none" stroke="#728477" stroke-width="2"/></svg><small>Capital y aportaciones: ${money(c)}</small></section><section><small>Dinero libre · independiente</small><h2>${money(s.free)}</h2>${field('Importe','freeamt')}<button onclick="freeMove(1)">Añadir</button> <button onclick="freeMove(-1)">Disponer</button></section><section><small>Margen de disposición estimado</small><h2>${money(margin())}</h2><button onclick="tab='Metas';render()">Ver condiciones</button></section>`}if(tab==='Cartera'){h=`<div class="center"><small>Mis inversiones</small><h2>${money(t)}</h2></div><section>${s.p.map(p=>`<details><summary class="line"><span>${esc(p.n)}</span><b>${money(p.v)}</b></summary><p>Participación: ${privacy?'•••':t?(p.v/t*100).toFixed(1):0}%</p>${privacy?'<p class="privacy-note">Muestra los saldos para editar los detalles.</p>':field('Nombre','n'+p.id,p.n,'text')+field('Tasa anual estimada (%)','r'+p.id,p.r)}<label><input style="width:auto" type="checkbox" id="l${p.id}" ${p.liq?'checked':''}> Liquidez inmediata confirmada</label><p>Rendimiento anual estimado: ${p.r===''?'—':money(p.v*Number(p.r)/100)}</p>${privacy?'':'<button onclick="edit('+p.id+')">Guardar detalles</button>'}</details>`).join('')}</section><section><h3>Nueva inversión</h3>${field('Nombre','newname','','text')}${field('Saldo inicial externo','newval',0)}<button onclick="add()">+ Añadir inversión</button><p class="muted">Si es un traspaso interno, crea la inversión con saldo cero.</p></section>`}if(tab==='Actividad'){h=`<section><h3>Nuevo movimiento</h3><label>Tipo<select id="kind"><option>Aportación</option><option>Rendimiento</option><option>Pérdida</option><option>Retiro</option><option>Traspaso</option><option>A dinero libre</option><option>Desde dinero libre</option></select></label><label>Inversión<select id="acc">${opts()}</select></label><label>Destino (solo traspasos)<select id="dest">${opts()}</select></label>${field('Importe','amt')}<button onclick="move()">Registrar</button></section><section><small>Historial</small>${s.logs.map(l=>`<div class="line"><span>${esc(l.k)}<br><small>${esc(l.n)} · ${new Date(l.date).toLocaleDateString('es-MX')}</small></span><span>${money(l.v)}</span></div>`).join('')||'<p>Sin movimientos.</p>'}</section>`}if(tab==='Metas'){let b=project();h=`<div class="center"><small>Objetivo principal</small><h2>${money(s.goal)}</h2><progress max="1" value="${privacy?0:Math.min(1,t/s.goal)}"></progress><p>${privacy?'•••':(t/s.goal*100).toFixed(1)+'%'} alcanzado · ${b>=600?'Fuera del horizonte':b+' meses estimados'}</p></div><section><small>Margen de disposición</small><h2>${money(margin())}</h2><p>Limitado por liquidez confirmada, reserva y escenario conservador de ${Math.max(0,s.rate-3)}% anual.</p>${field('Simular retiro','sim',0)}<button onclick="simulate()">Simular</button><p id="simresult"></p></section><section><h3>Supuestos</h3>${privacy?'<p class="privacy-note">Muestra los saldos para editar tus supuestos.</p>':field('Objetivo','goal',s.goal)+field('Aportación mensual','monthly',s.monthly)+field('Extraordinaria pendiente','extra',s.extra)+field('Tasa anual (%)','rate',s.rate)+field('Reserva líquida','reserve',s.reserve)+field('Retraso aceptable en meses','tol',s.tol)+'<button onclick="settings()">Guardar</button>'}<p>Estimaciones sin impuestos ni comisiones. Actualiza extraordinarias al recibirlas.</p></section>`}h+=`<section><small>Datos locales · ${available?'guardado en este navegador':'almacenamiento no disponible'}</small><p>Exporta un respaldo regularmente. El modo privacidad oculta la interfaz, pero no cifra el almacenamiento ni los respaldos.</p><button onclick="backup()">Exportar datos</button> <input type="file" accept="application/json" onchange="restore(this)"></section>`;$('view').innerHTML=h}function togglePrivacy(){privacy=!privacy;render()}
function openQuick(){quickKind='Aportación';quickTarget='free';drawQuick()}
function closeQuick(){$('overlay').innerHTML=''}
function drawQuick(){let targetOpts='<option value="free">Dinero libre</option>'+opts();$('overlay').innerHTML=`<div class="sheet-back" onclick="if(event.target===this)closeQuick()"><div class="sheet" role="dialog" aria-modal="true" aria-label="Movimiento rápido"><div class="line" style="padding-top:0"><h3>Movimiento rápido</h3><button class="eye" onclick="closeQuick()" aria-label="Cerrar">✕</button></div><p class="privacy-note">Los movimientos se registran localmente en este dispositivo.</p><label>Cuenta o inversión<select id="qtarget" onchange="quickTarget=this.value">${targetOpts}</select></label><div class="sheet-actions"><button class="pill ${quickKind==='Aportación'?'selected':''}" onclick="quickKind='Aportación';drawQuick()">+ Sumar</button><button class="pill ${quickKind==='Retiro'?'selected':''}" onclick="quickKind='Retiro';drawQuick()">− Restar</button></div>${field('Importe en MXN','qamount','')}<button class="wide" onclick="quickSave()">Guardar movimiento</button><button class="wide" style="margin-top:8px" onclick="closeQuick()">Cancelar</button></div></div>`;$('qtarget').value=quickTarget}
function quickSave(){let v=num('qamount'),isFree=quickTarget==='free',p=s.p.find(x=>String(x.id)===quickTarget);if(!positive(v)||!isFree&&!p)return alert('Ingresa un importe válido');if(quickKind==='Retiro'&&v>(isFree?s.free:p.v))return alert('El importe supera el saldo disponible');if(isFree)s.free+=(quickKind==='Aportación'?v:-v);else p.v+=(quickKind==='Aportación'?v:-v);log(quickKind+(isFree?' libre':''),isFree?'Libre':p.n,v);closeQuick();save()}
function positive(v){return Number.isFinite(v)&&v>0}function freeMove(d){let v=num('freeamt');if(!positive(v)||d<0&&v>s.free)return alert('Revisa el importe');s.free+=d*v;log(d>0?'Añadir libre':'Disponer libre','Libre',v);save()}function edit(id){let p=s.p.find(x=>x.id===id),n=$('n'+id).value.trim(),r=$('r'+id).value;if(!n||r!==''&&!Number.isFinite(Number(r)))return;p.n=n;p.r=r;p.liq=$('l'+id).checked;save()}function add(){let n=$('newname').value.trim(),v=num('newval');if(!n||!Number.isFinite(v)||v<0)return;s.p.push({id:Date.now(),n,v,r:'',liq:false});if(v)log('Aportación',n,v);save()}function move(){let k=$('kind').value,p=s.p.find(x=>x.id==num('acc')),d=s.p.find(x=>x.id==num('dest')),v=num('amt');if(!p||!positive(v))return alert('Revisa el importe');let out=['Pérdida','Retiro','Traspaso','A dinero libre'].includes(k);if(out&&v>p.v||k==='Desde dinero libre'&&v>s.free||k==='Traspaso'&&p===d)return alert('Movimiento no válido');p.v+=out?-v:v;if(k==='Traspaso')d.v+=v;if(k==='A dinero libre')s.free+=v;if(k==='Desde dinero libre')s.free-=v;log(k,p.n+(k==='Traspaso'?' → '+d.n:''),v);save()}function settings(){let keys=['goal','monthly','extra','rate','reserve','tol'],a=keys.map(num);if(a.some(v=>!Number.isFinite(v)||v<0)||a[0]<=0||a[3]>100)return alert('Revisa los valores');keys.forEach((k,i)=>s[k]=a[i]);save()}function simulate(){let w=num('sim');if(w<0||w>total()||!Number.isFinite(w))return;let n=project(w),b=project();$('simresult').textContent=(n>=600?'Fuera del horizonte':n+' meses; retraso: '+(n-b)+' meses')+(w>margin()?'. Supera el margen estimado.':'')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='capital-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.p)||!Array.isArray(x.logs)||!['free','goal','monthly','extra','rate','reserve','tol'].every(k=>Number.isFinite(x[k])&&x[k]>=0)||x.goal<=0||!x.p.every(p=>typeof p.n==='string'&&Number.isFinite(p.v)&&p.v>=0))throw Error();if(confirm('¿Reemplazar los datos actuales?')){s=x;save()}}catch(e){alert('Respaldo inválido')}}render();</script></html>
